// Perspectiva compartida. d = profundidad relativa al coche: d=0 es el plano del coche,
// d<0 lo que queda detrás (lejos) y d=1 lo más cercano a la cámara.
// El mundo sube hacia el coche (d disminuye). Los coches que adelantan vienen por detrás,
// bajan hacia la cámara y lanzan bombas hacia delante, que caen delante del coche.
const ROAD={horizon:332,carY:332,nearY:760,hitD:.05,farS:89};
const CAR_S=.92;
const HW0=150,HW1=230,SHOT_ROLL=.3;
const CONTACT={lat:92,dMin:-.12,dMax:.1};
const sstep=k=>k*k*(3-2*k);
function groundY(d){return d>=0?ROAD.carY+(ROAD.nearY-ROAD.carY)*Math.pow(Math.min(d,1.15),1.22):ROAD.carY+d*ROAD.farS}
function roadHalfWidth(d){return lerp(HW0,HW1,Math.pow(clamp(d,0,1),1.06))}
function laneAt(x0,d){return 210+(x0-210)*roadHalfWidth(d)/HW0}
function perspectiveScale(d){const c=clamp(d,-.5,1.15);return .92*(1+(c<0?1.5*c:.6*c))}
function itemDepth(q){return 1-clamp(q.progress,0,1.15)}
function itemProjection(q){const d=itemDepth(q),gy=groundY(d);return {x:laneAt(q.x,d),y:gy,gy,scale:perspectiveScale(d),d}}
function enemyProjection(e){return {x:laneAt(e.lane,e.d),y:groundY(e.d),scale:perspectiveScale(e.d),d:e.d}}
function shotPose(s){const landed=s.age>=s.fly,k=landed?1:clamp(s.age/s.fly,0,1);const d=landed?s.dl-SHOT_ROLL*(s.age-s.fly):lerp(s.d0,s.dl,k);const x=lerp(s.x0,s.xl,k),gy=groundY(d),sc=perspectiveScale(d);const lift=landed?0:(Math.sin(Math.PI*k)*(s.kind==='dynamite'?190:110)+(1-k)*(s.kind==='dynamite'?46:24))*sc;return {x:laneAt(x,d),gy,y:gy-lift,scale:sc,d,landed}}

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hitRegion(x,y){for(let i=regions.length-1;i>=0;i--){let r=regions[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r}return null}

function release(e){if(!pointer||pointer.id!==e.pointerId)return;const v=pos(e),p=pointer;pointer=null;if(p.ui&&!p.moved){const r=hitRegion(p.startX,p.startY);if(r&&v.x>=r.x-9&&v.x<=r.x+r.w+9&&v.y>=r.y-9&&v.y<=r.y+r.h+9){r.fn();beep('click')}}}
