// Perspective projection shared by enemy throws, ammunition, and pickups.
// A negative screen-space vertical displacement is the visible outgoing throw;
// gravity brings the object back onto the road, which scrolls toward the viewer.
const ROAD={horizon:338,hitT:.72,nearY:760};
function groundY(t){return ROAD.horizon+(ROAD.nearY-ROAD.horizon)*Math.pow(clamp(t,0,1.15),1.22)}
function roadHalfWidth(t){return lerp(30,212,Math.pow(clamp(t,0,1),1.06))}
function roadPerspectiveX(laneX,t,center=210){let hw=roadHalfWidth(t);let laneNorm=clamp((laneX-center)/168,-1,1);return center+laneNorm*hw;}
function roadX(startX,laneX,t){const u=clamp(t,0,1);return lerp(startX,laneX,u*u*(3-2*u))}
function perspectiveScale(t){return .32+1.9*Math.pow(clamp(t,0,1.1),1.14)}
function travelProjection(item){let t=clamp(item.progress,0,1.15),gy=groundY(t),sx=roadPerspectiveX(item.x,t,item.centerX??210),sc=perspectiveScale(t);return {x:sx,y:gy,gy,scale:sc,t,lift:0};}
function throwLift(t,kind){if(kind==='shot')return 6*Math.sin(Math.PI*clamp(t/.72,0,1));let touchdown=kind==='dynamite'?.76:.69;
 if(t<touchdown)return Math.sin(Math.PI*t/touchdown)*(kind==='dynamite'?85:115);
 if(t<touchdown+.18)return 18*Math.sin(Math.PI*(t-touchdown)/.18);
 return 0;
}
function throwingProjection(item){let t=clamp(item.progress,0,1.15),sx=roadX(item.startX,item.tx??item.x,t),gy=groundY(t),lift=throwLift(t,item.kind)+(item.kind==='shot'?0:t<.13?(1-t/.13)*27:0),sc=perspectiveScale(t);
 return {x:sx,y:gy-lift,gy,scale:sc,t,lift};}
function enemyProjection(e){let t=clamp(e.progress,0,1),x=roadPerspectiveX(e.laneX??e.baseX,t,210),y=groundY(t),scale=.36+1.95*Math.pow(t,1.1);return {x,y,scale,t};}

 else {supplyCrate(v.x,v.y,v.scale);if(v.t>.43&&v.t<.86){txt('WEAPON',v.x,v.y-39*v.scale,10*v.scale,'#57794d')}}

function updateMission(dt){let m=mission;if(!m||screen!=='game'||paused||popup)return;let p=m.player;m.seconds+=dt;m.waveTime+=dt;m.waveBanner=Math.max(0,m.waveBanner-dt);m.flash=Math.max(0,m.flash-dt);m.shake=Math.max(0,m.shake-dt*14);p.inv=Math.max(0,p.inv-dt);m.weaponBuff=Math.max(0,m.weaponBuff-dt);
let k=keys.ArrowLeft||keys.KeyA?-1:keys.ArrowRight||keys.KeyD?1:0;
if(k){m.auto=false;p.target=clamp(p.target+k*dt*330,43,378)}
if(m.auto){const danger=m.shots.filter(s=>!s.exploded&&!s.done&&s.progress>.24&&s.progress<ROAD.hitT&&Math.abs(s.tx-p.x)<68).sort((a,b)=>b.progress-a.progress)[0];

 if(danger){p.target=clamp(danger.tx+(p.x>danger.tx?98:-98),43,378)}

 else if(m.enemies.length){let target=m.enemies.filter(e=>!e.dead).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];if(target){let gap=target.x<p.x?78:-78;if(target.kind==='boss')gap=target.x<p.x?67:-67;p.target=clamp(target.x+gap,43,378)}}
 else p.target=clamp(210+Math.sin(clock*1.12)*57,43,378);
}
let old=p.x;p.x=clamp(lerp(p.x,p.target,1-Math.exp(-dt*(save.owned.speedDriver?11.25:9))),42,378);p.vx=lerp(p.vx,clamp((p.x-old)/Math.max(.002,dt),-450,450),1-Math.exp(-dt*10));

 let kind=(Math.random()<(e.kind==='boss'?.68:m.wave>=4?.48:.36))?'dynamite':'shot';throwEnemyObject(e,p,kind);

drawHUD(m);ctx.restore()}

function pauseScreen(){drawGame();ctx.fillStyle='#2429259c';ctx.fillRect(0,0,W,H);card(45,242,330,281,'#fffdf6');txt('PAUSED',210,283,29);txt(`Wave ${mission.wave} / 6`,210,328,18);button('RESUME ▶',80,369,262,55,()=>{paused=false;screen='game'},{color:'#f8d16d',size:22});button('QUIT TO MAP',101,446,220,46,()=>{paused=false;mission=null;screen='map'},{size:18});}
function resultsScreen(){backgroundPaper();txt('ESCAPED!',210,62,39,'#84ad5c');drawCar(210,217,.92,CARS.find(c=>c.id===save.car).color);for(let i=0;i<14;i++){let x=(i*47.13)%W,y=140+(i*39)%200;ctx.save();ctx.translate(x,y);ctx.rotate(i*.8);fillRound(0,0,6,13,i%2?'#b6d98c':'#f8d37d',2,null);ctx.restore()}
card(28,326,364,276);txt(`LEVEL ${mission.level} COMPLETED`,210,348,21);txt(`Time    ${mission.seconds.toFixed(2)} sec`,210,386,15,'#7b7063');line([[46,410],[374,410]],'#ded9cb',1.5);
txt('Coins stolen from bank',53,439,14,'#555249','left');txt(mission.bankLoot,356,439,17,'#413e36','right');txt('Earn money by destroying',53,481,13,'#555249','left');txt(mission.killLoot,356,481,17,'#413e36','right');txt('Perfect Bonus',53,522,14,'#555249','left');txt(mission.perfect,356,522,17,'#413e36','right');line([[46,547],[374,547]],'#999085',2);coin(113,577,15);txt(`TOTAL    ${(mission.bankLoot+mission.killLoot+mission.perfect).toLocaleString('en-US')}`,229,577,22);
button('LUCKY SPIN',26,635,167,57,()=>{screen='roulette';spin=null},{color:'#f2a38e',size:18});button('NEXT →',215,635,182,57,()=>{screen='garage';gearTab='weapon';selectedItem=save.weapon},{color:'#f5d06b',size:21});button('BANK MAP',127,703,167,36,()=>screen='map',{size:14});}
function drawPopup(){if(!popup)return;ctx.fillStyle='#2524209e';ctx.fillRect(0,0,W,H);regions.push({x:0,y:0,w:W,h:H,fn:()=>{}});card(36,231,348,278,'#fffdf6');txt(popup.title,210,274,26,'#34362e');if(popup.symbol==='coin')coin(210,338,31);else if(popup.symbol==='gem')gem(210,337,37);else if(popup.symbol==='gun')weaponIcon('shot',210,337,2);else txt('!',210,342,58,'#e3a647');wrapText(popup.message,210,395,315,17);if(popup.confirm){button('CANCEL',55,443,141,47,()=>popup=null,{size:17});button('RESET',216,443,147,47,()=>popup.confirm(),{color:'#eec0ae',size:17});}else button('NICE!',113,444,194,49,()=>popup=null,{color:'#f7d376',size:21});}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hitRegion(x,y){for(let i=regions.length-1;i>=0;i--){let r=regions[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r}return null}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const v=pos(e),ui=!!hitRegion(v.x,v.y);pointer={id:e.pointerId,x:v.x,y:v.y,startX:v.x,startY:v.y,ui,moved:false};if(screen==='game'&&!ui){mission.auto=false;mission.player.target=clamp(v.x,43,378)}},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const v=pos(e);if(Math.abs(v.x-pointer.startX)>9||Math.abs(v.y-pointer.startY)>9)pointer.moved=true;pointer.x=v.x;pointer.y=v.y;if(screen==='game'&&!pointer.ui&&!popup)mission.player.target=clamp(v.x,43,378)},{passive:false});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;const v=pos(e),p=pointer;pointer=null;if(p.ui&&!p.moved){const r=hitRegion(p.startX,p.startY);if(r&&v.x>=r.x-9&&v.x<=r.x+r.w+9&&v.y>=r.y-9&&v.y<=r.y+r.h+9){r.fn();beep('click')}}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{pointer=null});
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='KeyP'||e.code==='Escape'){if(screen==='game'){screen='pause';paused=true;}else if(screen==='pause'){screen='game';paused=false;}}if(e.code==='KeyM'){save.sound=!save.sound;persist();showToast(save.sound?'Sound on':'Sound off')}if(e.code==='Enter'&&screen==='home'){screen=save.seenTutorial?'map':'tutorial'}});
window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{keys={};pointer=null;if(screen==='game'){screen='pause';paused=true}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'){screen='pause';paused=true}last=performance.now()});
function frame(now){let dt=Math.min((now-last)/1000,.042);last=now;clock+=dt;accum+=dt;while(accum>=1/60){updateMission(1/60);accum-=1/60}
if(spin?.active&&screen==='roulette'){let u=clamp((clock-spin.start)/spin.duration,0,1);spin.angle=lerp(spin.from,spin.to,1-Math.pow(1-u,5));if(u>=1){spin.active=false;awardSpin();}}
regions=[];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);switch(screen){case'home':homeScreen();break;case'tutorial':tutorialScreen();break;case'map':drawMap();break;case'garage':garageScreen();break;case'shop':shopScreen();break;case'roulette':rouletteScreen();break;case'game':drawGame();break;case'pause':pauseScreen();break;case'defeat':defeatScreen();break;case'results':resultsScreen();break;case'settings':settingsScreen();break;default:screen='home';homeScreen()}
if(popup)drawPopup();if(toastUntil&&performance.now()>toastUntil){document.getElementById('toast').classList.remove('visible');toastUntil=0}requestAnimationFrame(frame)}
if(location.search.includes('debug=1'))window.KittenTaxiQA={
 state:()=>({screen,wave:mission?.wave,seconds:mission?.seconds,health:mission?.player.hp,coins:save.coins,weaponBuff:mission?.weaponBuff,bonusWeapon:mission?.bonusWeapon,itemsCollected:mission?.itemsCollected,bombsDodged:mission?.bombsDodged,shots:mission?.shots.map(q=>({kind:q.kind,progress:q.progress,x:q.tx,exploded:q.exploded})),pickups:mission?.pickups.map(q=>({kind:q.kind,progress:q.progress,x:q.x}))}),
 start:(i=0)=>startMission(i), wave:()=>nextWave(), win:()=>missionVictory(),
 setPlayer:(x)=>{mission.auto=false;mission.player.x=clamp(x,43,378);mission.player.target=mission.player.x},
 throw:(kind='dynamite',x=210)=>{let e={x,startX:x};throwEnemyObject(e,mission.player,kind);return mission.shots[mission.shots.length-1]},
 pickup:(kind='crate',x=210)=>spawnPickup(kind,x,10,x),
 step:(secs=1)=>{for(let t=0;t<secs*60;t++)updateMission(1/60)}
};
resize();window.addEventListener('resize',resize);requestAnimationFrame(frame);

})();
</script></body></html>
