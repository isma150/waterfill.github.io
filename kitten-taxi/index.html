<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kitten Taxi: versión HTML no oficial de conducción y disparo por oleadas, con arte dibujado a lápiz.">
<title>Kitten Taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
:root { --paper: #f7f5ef; }
html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage { position: relative; width: 390px; height: 844px; flex: none; transform: scale(var(--k, 1)); background: var(--paper); touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
#game { position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="390" height="844"></canvas>
  </div>
</div>
<script src="js/art.js"></script>
<script src="js/state.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
