// Perspectiva compartida. d = profundidad relativa al coche: d=0 es el plano del coche,
// d<0 lo que queda detrás (lejos) y d=1 lo más cercano a la cámara.
// El mundo sube hacia el coche (d disminuye). Los coches que adelantan vienen por detrás,
// bajan hacia la cámara y lanzan bombas hacia delante, que caen delante del coche.
const ROAD={horizon:297,carY:319,nearY:760,hitD:.05,farS:100};
const CAR_S=.92;
const HW0=148,HW1=238,SHOT_ROLL=.26;
const CONTACT={lat:100,dMin:-.26,dMax:.28};
const sstep=k=>k*k*(3-2*k);
function groundY(d){return d>=0?ROAD.carY+(ROAD.nearY-ROAD.carY)*Math.pow(Math.min(d,1.15),1.22):ROAD.carY+d*ROAD.farS}
function roadHalfWidth(d){return lerp(HW0,HW1,Math.pow(clamp(d,0,1),1.06))}
function laneAt(x0,d){return 210+(x0-210)*roadHalfWidth(d)/HW0}
function perspectiveScale(d){const c=clamp(d,-.5,1.15);return .92*(1+(c<0?1.5*c:.6*c))}
function itemDepth(q){return 1-clamp(q.progress,0,1.15)}
function itemProjection(q){const d=itemDepth(q),gy=groundY(d);return {x:laneAt(q.x,d),y:gy,gy,scale:perspectiveScale(d),d}}
function enemyProjection(e){return {x:laneAt(e.lane,e.d),y:groundY(e.d),scale:perspectiveScale(e.d),d:e.d}}
function shotPose(s){
 const landed=s.age>=s.fly,k=landed?1:clamp(s.age/s.fly,0,1);
 const d=landed?s.dl-SHOT_ROLL*(s.age-s.fly):lerp(s.d0,s.dl,k);
 const lane=lerp(s.x0,s.xl,k),gy=groundY(d),sc=perspectiveScale(d);
 const lift=landed?0:(Math.sin(Math.PI*k)*150+(1-k)*24)*sc;
 return {x:laneAt(lane,d),gy,y:gy-lift,scale:sc,d,landed};
}

function drawEnemyObj(e){let sc=perspectiveScale(e.d);ctx.save();

 }

drawPlayerHp(m);
for(let it of list)if(it.d>=0)it.fn();

drawHUD(m);
if(m.guide)drawGuidedOverlay(m);
if(m.tunnelBonus)drawTunnelBonus(m.tunnelBonus);ctx.restore()}

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hitRegion(x,y){for(let i=regions.length-1;i>=0;i--){let r=regions[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r}return null}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const v=pos(e),ui=!!hitRegion(v.x,v.y);pointer={id:e.pointerId,x:v.x,y:v.y,startX:v.x,startY:v.y,ui,moved:false};if(screen==='tutorial'&&!ui)TP.target=clamp(v.x,80,340);if(screen==='game'&&!ui&&!mission.tunnel){mission.auto=false;mission.player.target=clamp(v.x,64,356)}},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const v=pos(e);if(Math.abs(v.x-pointer.startX)>9||Math.abs(v.y-pointer.startY)>9)pointer.moved=true;pointer.x=v.x;pointer.y=v.y;if(screen==='game'&&!mission.tunnel&&!pointer.ui&&!popup)mission.player.target=clamp(v.x,64,356);if(screen==='tutorial'&&!pointer.ui)TP.target=clamp(v.x,80,340)},{passive:false});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;const v=pos(e),p=pointer;pointer=null;if(p.ui&&!p.moved){const r=hitRegion(p.startX,p.startY);if(r&&v.x>=r.x-9&&v.x<=r.x+r.w+9&&v.y>=r.y-9&&v.y<=r.y+r.h+9){r.fn();beep('click')}}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',e=>{pointer=null});
function focusAction(dir=1){if(!regions.length)return;focusIndex=((focusIndex+dir)%regions.length+regions.length)%regions.length;const a=regions[focusIndex];document.getElementById('a11yStatus').textContent=a?.label||'Control';}
function invokeAction(){const a=regions[focusIndex];if(!a||!a.fn)return false;a.fn();beep('click');return true;}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Tab'){e.preventDefault();focusAction(e.shiftKey?-1:1);return}if(e.repeat)return;if(['Enter','Space'].includes(e.code)&&focusIndex>=0){e.preventDefault();if(invokeAction()){focusIndex=-1;return}}if(e.code==='KeyP'||e.code==='Escape'){if(screen==='game')enterPause();else if(screen==='pause')leavePause();}if(e.code==='KeyM'){save.sound=!save.sound;persist();if(!save.sound)stopMusic();else if(screen==='game')startMusic();showToast(save.sound?'Sound on':'Sound off')}if(e.code==='Enter'&&screen==='home'){if(save.seenTutorial)screen='map';else startMission(0,true)}});
window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{keys={};pointer=null;if(screen==='game')enterPause()});

function frame(now){let dt=Math.min((now-last)/1000,.042);last=now;clock+=dt;accum+=dt;while(accum>=1/60){updateMission(1/60);accum-=1/60}
if(spin?.active&&screen==='roulette'){let u=clamp((clock-spin.start)/spin.duration,0,1);spin.angle=lerp(spin.from,spin.to,1-Math.pow(1-u,5));if(u>=1){spin.active=false;awardSpin();}}
if(screen==='tutorial')tutorialUpdate(dt);regions=[];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);switch(screen){case'home':homeScreen();break;case'tutorial':tutorialScreen();break;case'map':drawMap();break;case'garage':garageScreen();break;case'shop':shopScreen();break;case'roulette':rouletteScreen();break;case'game':drawGame();break;case'pause':pauseScreen();break;case'defeat':defeatScreen();break;case'results':resultsScreen();break;case'settings':settingsScreen();break;default:screen='home';homeScreen()}

if(toastUntil&&performance.now()>toastUntil){document.getElementById('toast').classList.remove('visible');toastUntil=0}requestAnimationFrame(frame)}
resize();window.addEventListener('resize',resize);requestAnimationFrame(frame);
